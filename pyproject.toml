[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-update-free"
version = "1.6.0"
description = "Tự động quét và đồng bộ Combos & Mô hình AI Miễn phí từ 9router/OmniRouter vào OpenCode"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Auto-Update-Free Team", email = "auto-update-free@example.com"}
]
maintainers = [
    {name = "Auto-Update-Free Team", email = "auto-update-free@example.com"}
]
keywords = [
    "ai", "llm", "openai", "opencode", "router", "9router", "omnirouter",
    "free-models", "combos", "desktop", "linux", "customtkinter"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31.0",
    "customtkinter>=5.2.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/your-username/auto-update-free"
Repository = "https://github.com/your-username/auto-update-free"
Issues = "https://github.com/your-username/auto-update-free/issues"
Documentation = "https://github.com/your-username/auto-update-free#readme"

[project.scripts]
auto-update-free = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.setuptools.package-data]
"*" = ["*.png", "*.ico", "*.desktop", "*.sh"]

[tool.ruff]
line-length = 120
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "SIM", "T20"]
ignore = ["E501", "B008", "C901"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true